name: Go Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Скачивание исходного кода репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # Шаг 2: Настройка Go и динамический поиск go.sum для кэша
    - name: Setup Go environment
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'
        cache: true 
        cache-dependency-path: '**/go.sum'

    # Шаг 3: Автоматический поиск проекта, проверка форматирования, тесты и сборка
    - name: Find Go Project, Test and Build
      run: |
        # Ищем, в какой папке лежит go.mod (исключая скрытые каталоги)
        MOD_PATH=$(find . -name "go.mod" -not -path '*/.*' | head -n 1)
        
        if [ -z "$MOD_PATH" ]; then
          echo "❌ Ошибка: Файл go.mod не найден ни в одной из папок репозитория!"
          exit 1
        fi
        
        # Получаем путь к директории, где лежит найденный go.mod
        PROJECT_DIR=$(dirname "$MOD_PATH")
        echo "📂 Проект Go обнаружен в папке: $PROJECT_DIR"
        
        # Переходим в папку проекта
        cd "$PROJECT_DIR"
        
        echo "🧼 Проверяем форматирование кода..."
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ Ошибка: Следующие файлы не отформатированы по стандарту Go:"
          echo "$UNFORMATTED"
          echo "👉 Запустите локально команду 'go fmt ./...' перед отправкой кода!"
          exit 1
        fi
        
        echo "🧪 Запускаем тесты..."
        go test -v -race -covermode=atomic -coverprofile=coverage.txt ./...
        
        echo "🔨 Собираем бинарник..."
        go build -v -o myapp ./...
        
        # Переносим бинарник в корень, чтобы шаг сохранения артефактов легко его нашел
        mv myapp "$GITHUB_WORKSPACE/myapp"

    # Шаг 4: Сохранение собранного приложения в артефакты
    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: myapp-binary
        path: myapp
        retention-days: 14
