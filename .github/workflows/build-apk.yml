name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List directory structure
      run: |
        echo "Current directory:"
        pwd
        echo ""
        echo "Directory contents:"
        ls -la
        echo ""
        echo "Check for app directory:"
        if [ -d "app" ]; then echo "✓ app directory exists"; else echo "✗ app directory NOT found"; fi
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: Create .env file
      run: echo "GEMINI_API_KEY=placeholder" > .env
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace -x test
      continue-on-error: true
    
    - name: Check build output
      run: |
        echo "Checking build outputs..."
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
        retention-days: 30
    
    - name: Build Status
      if: always()
      run: echo "Build completed with status: ${{ job.status }}"
