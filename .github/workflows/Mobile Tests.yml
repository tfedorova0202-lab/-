- name: AppClaw Mobile Tests
  # You may pin to the exact commit or the version.
  # uses: appclawhq/AppClaw@4f8b577fe0949e9df51f70a625e2f7b001ca71c4
  uses: appclawhq/AppClaw@v1.1.0
  with:
    # Path to a YAML flow file (mutually exclusive with goal)
    flow: # optional, default is 
    # Natural language goal for the LLM agent (mutually exclusive with flow)
    goal: # optional, default is 
    # Target platform: android or ios
    platform: # optional, default is android
    # LLM provider: gemini, anthropic, openai, groq
    provider: # optional, default is gemini
    # LLM API key — passed to AppClaw as LLM_API_KEY
    api-key: 
    # LLM model ID to use (e.g. gemini-2.0-flash, claude-3-5-haiku-20241022). Defaults to the provider built-in.
    model: # optional, default is 
    # Interaction strategy: dom (element locators) or vision (screenshot AI)
    agent-mode: # optional, default is dom
    # Maximum agent steps before the run is marked failed. Default: 30
    max-steps: # optional, default is 30
    # Delay in milliseconds between steps. Default: 500
    step-delay: # optional, default is 500
    # Android emulator API level. Default: 33 (Android 13)
    android-api-level: # optional, default is 33
    # Android AVD hardware profile. Default: pixel_6
    android-profile: # optional, default is pixel_6
    # Emulator system image target: default or google_apis
    android-target: # optional, default is default
    # Emulator CPU architecture: x86_64 or x86. Default: x86_64 (required for API 31+)
    android-arch: # optional, default is x86_64
    # Cloud device provider: lambdatest. Leave empty for local emulator/simulator (default).
    cloud-provider: # optional, default is 
    # LambdaTest account username (required when cloud-provider=lambdatest)
    lambdatest-username: # optional, default is 
    # LambdaTest access key (required when cloud-provider=lambdatest)
    lambdatest-access-key: # optional, default is 
    # Cloud device name, e.g. "Pixel 7" or "iPhone 14" (required when cloud-provider=lambdatest)
    lambdatest-device-name: # optional, default is 
    # Cloud OS version, e.g. "13" for Android or "16" for iOS (required when cloud-provider=lambdatest)
    lambdatest-os-version: # optional, default is 
    # LambdaTest app ID (lt://APP...) — the app to test on the cloud device
    lambdatest-app: # optional, default is 
    # Upload HTML report as a workflow artifact after the run. Default: true
    report: # optional, default is true
    # Name of the uploaded artifact. Default: appclaw-report
    report-name: # optional, default is appclaw-report
    # AppClaw npm package version to install. Default: latest
    appclaw-version: # optional, default is latest
    # Build and install AppClaw from the checked-out source instead of npm. Use in PRs to test local changes.
    use-local-build: # optional, default is false
